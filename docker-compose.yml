services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python -m bots.razvivayka.main
    environment:
      BOT_UI_DB_PATH: /data/bot-ui.sqlite3
    volumes:
      - game_data:/data
    depends_on:
      api:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GAME_DB_PATH: /data/teramont-games.sqlite3
    command: uvicorn webapp.backend.main:app --host 0.0.0.0 --port 8001
    expose:
      - "8001"
    volumes:
      - game_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8001/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  game_data:

