name: Lumen simulation and artwork
on:
  push:
    paths: ['webapp/frontend/js/lumen/**', 'webapp/frontend/assets/lumen/**', 'design/lumen-pixel/**', 'design/lumen-arsenal/**', 'design/lumen-campaign/**', 'tests/lumen-*.mjs', 'tests/fixtures/lumen-v1.json', 'tests/test_lumen_art.py', '.github/workflows/lumen-checks.yml']
  pull_request:
    paths: ['webapp/frontend/js/lumen/**', 'webapp/frontend/assets/lumen/**', 'design/lumen-pixel/**', 'design/lumen-arsenal/**', 'design/lumen-campaign/**', 'tests/lumen-*.mjs', 'tests/fixtures/lumen-v1.json', 'tests/test_lumen_art.py', '.github/workflows/lumen-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: design/lumen-pixel/requirements.txt}
      - run: pip install -r design/lumen-pixel/requirements.txt
      - run: node --test tests/lumen-engine.mjs tests/lumen-presentation.mjs tests/lumen-progression.mjs tests/lumen-economy.mjs tests/lumen-arsenal.mjs tests/lumen-campaign.mjs
      - run: python tests/test_lumen_art.py
      - run: for script in webapp/frontend/js/lumen/*.mjs; do node --check "$script"; done
      - run: git diff --check
